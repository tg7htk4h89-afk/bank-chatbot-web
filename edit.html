<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat3PT - Knowledge Base Manager</title>
    <style>
        :root {
            --bg1: #e8f1f6; --bg2: #eef2ff; --card: #ffffff; --text: #0f172a;
            --muted: #64748b; --border: #e2e8f0; --shadow: 0 14px 40px rgba(2, 6, 23, .10);
            --brand: #1f7a6b; --brand-light: rgba(31, 122, 107, 0.1); --brand2: #0ea5e9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: ui-sans-serif, system-ui, sans-serif;
            background: linear-gradient(180deg, var(--bg1), var(--bg2));
            min-height: 100vh; padding: 20px; color: var(--text);
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header {
            background: rgba(255,255,255,.9); border-radius: 20px; padding: 24px;
            margin-bottom: 24px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center;
        }
        .mode-switch {
            background: var(--bg1); padding: 4px; border-radius: 12px; display: flex; gap: 4px;
        }
        .mode-btn {
            padding: 8px 16px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s;
        }
        .mode-btn.active { background: var(--brand); color: white; }
        .card {
            background: white; border-radius: 20px; padding: 30px; margin-bottom: 24px; box-shadow: var(--shadow);
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-label { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: block; }
        .form-input, .form-select, .form-textarea {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
        }
        .btn {
            padding: 12px 24px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; background: var(--brand); color: white;
        }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; padding: 20px; background: var(--brand-light); border-radius: 12px; }
        .hidden { display: none; }
        /* Reuse previous CSS for other elements */
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📝 Knowledge Base Manager</h1>
                <p>Add or Update Database Items</p>
            </div>
            <div class="mode-switch">
                <button class="mode-btn active" onclick="setMode('add')">Add New</button>
                <button class="mode-btn" onclick="setMode('edit')">Edit Existing</button>
            </div>
        </div>

        <div class="card">
            <div id="searchSection" class="hidden">
                <div class="search-box">
                    <input type="text" id="searchId" class="form-input" placeholder="Enter ID (e.g., PRD-001)">
                    <button class="btn" onclick="fetchItem()">🔍 Load Data</button>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label class="form-label">Select Data Type</label>
                <select id="typeSelect" class="form-select" onchange="renderForm()">
                    <option value="product">Product</option>
                    <option value="procedure">Procedure</option>
                    <option value="policy">Policy</option>
                </select>
            </div>

            <div id="dynamicForm"></div>

            <div style="text-align: right; margin-top: 20px;">
                <button class="btn" onclick="submitForm()">Submit to Database</button>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://taherkib.app.n8n.cloud/webhook/bf161d07-e9be-48fe-bdfa-0ea9e3e1abb5"; 
        
        let currentMode = 'add';
        let currentId = null;

        const schemas = {
            product: [
                { name: 'product_id', label: 'Product ID (Auto/Read-only)', type: 'text', readonly: true },
                { name: 'product_name', label: 'Product Name', type: 'text' },
                { name: 'family', label: 'Family', type: 'select', options: ['Cards', 'Accounts', 'Loans'] },
                { name: 'tier', label: 'Tier', type: 'select', options: ['Basic', 'Standard', 'Plus', 'Premium'] },
                { name: 'description', label: 'Description', type: 'textarea', full: true },
                { name: 'features', label: 'Features', type: 'textarea', full: true },
                { name: 'eligibility', label: 'Eligibility', type: 'textarea', full: true },
                { name: 'fees', label: 'Fees', type: 'text' },
                { name: 'channels', label: 'Channels', type: 'text' },
                { name: 'keywords', label: 'Keywords', type: 'text', full: true },
                { name: 'owner', label: 'Owner', type: 'text' },
                { name: 'status', label: 'Status', type: 'select', options: ['draft', 'active', 'inactive'] }
            ],
            procedure: [
                { name: 'procedure_id', label: 'Procedure ID', type: 'text', readonly: true },
                { name: 'procedure_name', label: 'Procedure Name', type: 'text' },
                { name: 'related_area', label: 'Related Area', type: 'text' },
                { name: 'step_by_step', label: 'Steps', type: 'textarea', full: true },
                { name: 'sla', label: 'SLA', type: 'text' },
                { name: 'keywords', label: 'Keywords', type: 'text', full: true },
                { name: 'owner', label: 'Owner', type: 'text' }
            ],
            policy: [
                { name: 'policy_id', label: 'Policy ID', type: 'text', readonly: true },
                { name: 'policy_name', label: 'Policy Name', type: 'text' },
                { name: 'scope', label: 'Scope', type: 'text' },
                { name: 'summary', label: 'Summary', type: 'textarea', full: true },
                { name: 'do', label: 'Do', type: 'textarea', full: true },
                { name: 'dont', label: 'Don\'t', type: 'textarea', full: true },
                { name: 'keywords', label: 'Keywords', type: 'text', full: true },
                { name: 'owner', label: 'Owner', type: 'text' }
            ]
        };

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            if(mode === 'edit') {
                document.getElementById('searchSection').classList.remove('hidden');
            } else {
                document.getElementById('searchSection').classList.add('hidden');
                document.getElementById('dynamicForm').reset();
                currentId = null;
            }
            renderForm();
        }

        function renderForm(data = {}) {
            const type = document.getElementById('typeSelect').value;
            const fields = schemas[type];
            let html = '<div class="form-grid">';
            
            fields.forEach(field => {
                const value = data[field.name] || '';
                const isReadOnly = field.readonly || (field.name.includes('_id') && currentMode === 'add');
                
                html += `
                <div class="form-group ${field.full ? 'full' : ''}">
                    <label class="form-label">${field.label}</label>
                    ${field.type === 'textarea' 
                        ? `<textarea name="${field.name}" class="form-textarea" ${isReadOnly ? 'disabled' : ''}>${value}</textarea>`
                        : field.type === 'select'
                            ? `<select name="${field.name}" class="form-select">
                                ${field.options.map(o => `<option value="${o}" ${value === o ? 'selected' : ''}>${o}</option>`).join('')}
                               </select>`
                            : `<input type="text" name="${field.name}" value="${value}" class="form-input" ${isReadOnly ? 'disabled' : ''}>`
                    }
                </div>`;
            });
            html += '</div>';
            document.getElementById('dynamicForm').innerHTML = html;
        }

        async function fetchItem() {
            const id = document.getElementById('searchId').value;
            const type = document.getElementById('typeSelect').value;
            if(!id) return alert("Please enter an ID");

            try {
                // We send a GET request with query params to the n8n webhook
                const response = await fetch(`${WEBHOOK_URL}?action=fetch&id=${id}&type=${type}`);
                const data = await response.json();
                
                if(data.error) {
                    alert("Item not found");
                } else {
                    currentId = id;
                    renderForm(data); // Populate form
                }
            } catch(e) {
                alert("Error fetching data: " + e.message);
            }
        }

        async function submitForm() {
            const type = document.getElementById('typeSelect').value;
            const inputs = document.querySelectorAll('#dynamicForm [name]');
            let payload = {
                type: type,
                action: currentMode === 'add' ? 'add_item' : 'update_item',
                data: {}
            };

            inputs.forEach(input => {
                if(!input.disabled) {
                    payload.data[input.name] = input.value;
                }
            });

            if(currentMode === 'edit') {
                payload.data[type + '_id'] = currentId; // Ensure ID is sent for updates
            }

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if(response.ok) {
                    alert("Success! Database updated.");
                    if(currentMode === 'add') location.reload();
                } else {
                    alert("Error updating database.");
                }
            } catch(e) {
                alert("Network error: " + e.message);
            }
        }
        
        // Init
        renderForm();
    </script>
</body>
</html>
