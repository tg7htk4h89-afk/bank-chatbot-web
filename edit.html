<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIB Knowledge Base Editor</title>
  <style>
    :root {
      --bg1: #f8fafc; --bg2: #e2e8f0; --card: #ffffff; --text: #0f172a;
      --muted: #64748b; --border: #cbd5e1; --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --brand: #1f7a6b; --brand-light: rgba(31, 122, 107, 0.1); --brand-hover: #16594e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      min-height: 100vh; padding: 20px; color: var(--text);
    }
    .container { max-width: 1000px; margin: 0 auto; }
    .header {
      background: rgba(255,255,255,0.95); border-radius: 16px; padding: 24px;
      margin-bottom: 24px; box-shadow: var(--shadow); backdrop-filter: blur(8px);
    }
    .header h1 { font-size: 24px; color: var(--brand); display: flex; align-items: center; gap: 10px; }
    .card {
      background: white; border-radius: 16px; padding: 32px;
      margin-bottom: 24px; box-shadow: var(--shadow);
    }
    /* Stepper */
    .step-indicator {
      display: flex; justify-content: space-between; margin-bottom: 40px; position: relative;
    }
    .step-indicator::before {
      content: ''; position: absolute; top: 15px; left: 0; right: 0;
      height: 2px; background: var(--border); z-index: 0;
    }
    .step {
      position: relative; z-index: 1; flex: 1; display: flex;
      flex-direction: column; align-items: center; gap: 8px; cursor: default;
    }
    .step-circle {
      width: 32px; height: 32px; border-radius: 50%; background: white; border: 2px solid var(--border);
      color: var(--muted); display: grid; place-items: center; font-weight: 700; font-size: 14px;
      transition: all 0.3s ease;
    }
    .step.active .step-circle { 
      background: var(--brand); border-color: var(--brand); color: white; 
      box-shadow: 0 0 0 4px var(--brand-light); 
    }
    .step.completed .step-circle { 
      background: #10b981; border-color: #10b981; color: white; 
    }
    .step-label { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; background: white; padding: 0 4px; }
    .step.active .step-label { color: var(--brand); }
    
    /* Forms */
    .form-section { display: none; animation: slideUp 0.4s ease-out; }
    .form-section.active { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .type-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 20px 0; }
    .type-card {
      padding: 20px; border: 2px solid var(--border); border-radius: 12px;
      text-align: center; cursor: pointer; transition: all 0.2s;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .type-card:hover { border-color: var(--brand); background: var(--brand-light); transform: translateY(-2px); }
    .type-card.selected { border-color: var(--brand); background: var(--brand-light); }
    .type-icon { font-size: 28px; }
    .type-label { font-weight: 600; font-size: 14px; }

    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-label { font-size: 13px; font-weight: 600; color: #334155; }
    .form-input, .form-select, .form-textarea {
      padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; width: 100%;
      font-size: 14px; transition: border-color 0.2s; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-light); }
    .form-textarea { min-height: 80px; resize: vertical; font-family: inherit; }
    
    .mode-toggle {
      display: flex; gap: 4px; background: var(--bg2); padding: 4px; border-radius: 8px; 
      width: fit-content; margin: 0 auto 24px;
    }
    .mode-btn {
      padding: 6px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px;
      background: transparent; color: var(--muted); transition: all 0.2s;
    }
    .mode-btn.active { background: white; color: var(--brand); shadow: 0 1px 2px rgba(0,0,0,0.1); }

    .search-container {
      background: var(--brand-light); padding: 20px; border-radius: 12px; margin-top: 20px;
      display: none; border: 1px solid rgba(31, 122, 107, 0.2);
    }
    .search-container.show { display: block; }
    .search-row { display: flex; gap: 10px; }
    
    .btn {
      padding: 10px 24px; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
      transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-primary { background: var(--brand); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--brand-hover); }
    .btn-secondary { background: white; border: 1px solid var(--border); color: var(--text); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .button-group { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--bg2); }

    /* Review Area */
    .review-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; font-size: 14px; }
    .review-item { background: var(--bg1); padding: 12px; border-radius: 8px; }
    .review-item.full { grid-column: 1 / -1; }
    .review-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .review-val { font-weight: 500; word-break: break-word; }

    @media (max-width: 640px) {
      .form-grid, .review-grid, .type-selector { grid-template-columns: 1fr; }
      .step-label { display: none; }
      .header h1 { font-size: 20px; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📚 KIB Knowledge Base Editor</h1>
  </div>

  <div class="card">
    <div class="step-indicator">
      <div class="step active" data-step="1">
        <div class="step-circle">1</div>
        <div class="step-label">Type & Mode</div>
      </div>
      <div class="step" data-step="2">
        <div class="step-circle">2</div>
        <div class="step-label">Core Info</div>
      </div>
      <div class="step" data-step="3">
        <div class="step-circle">3</div>
        <div class="step-label">Details</div>
      </div>
      <div class="step" data-step="4">
        <div class="step-circle">4</div>
        <div class="step-label">Review</div>
      </div>
    </div>

    <div class="form-section active" id="section1">
      <div class="mode-toggle">
        <button class="mode-btn active" onclick="setMode('add', event)">New Entry</button>
        <button class="mode-btn" onclick="setMode('edit', event)">Edit Existing</button>
      </div>

      <div class="type-selector">
        <div class="type-card" onclick="selectType('product', this)">
          <div class="type-icon">💳</div>
          <div class="type-label">Product</div>
        </div>
        <div class="type-card" onclick="selectType('procedure', this)">
          <div class="type-icon">📋</div>
          <div class="type-label">Procedure</div>
        </div>
        <div class="type-card" onclick="selectType('policy', this)">
          <div class="type-icon">⚖️</div>
          <div class="type-label">Policy</div>
        </div>
      </div>

      <div class="search-container" id="searchBox">
        <label class="form-label">Search by ID</label>
        <div class="search-row">
          <input type="text" id="searchId" class="form-input" placeholder="e.g., PRD-0001">
          <button class="btn btn-primary" onclick="fetchData()">Search</button>
        </div>
        <p id="searchStatus" style="margin-top:8px; font-size:13px; color:var(--muted);"></p>
      </div>

      <div class="button-group">
        <button class="btn btn-primary" id="btnStep1" onclick="nextStep()" disabled>Next Step &rarr;</button>
      </div>
    </div>

    <div class="form-section" id="section2">
      <h2>Core Information</h2>
      <div id="formBasic" class="form-grid" style="margin-top:20px;"></div>
      <div class="button-group">
        <button class="btn btn-secondary" onclick="prevStep()">&larr; Back</button>
        <button class="btn btn-primary" onclick="nextStep()">Next Step &rarr;</button>
      </div>
    </div>

    <div class="form-section" id="section3">
      <h2>Detailed Attributes</h2>
      <div id="formDetails" class="form-grid" style="margin-top:20px;"></div>
      <div class="button-group">
        <button class="btn btn-secondary" onclick="prevStep()">&larr; Back</button>
        <button class="btn btn-primary" onclick="nextStep()">Review &rarr;</button>
      </div>
    </div>

    <div class="form-section" id="section4">
      <h2 style="margin-bottom:20px;">Review Entry</h2>
      <div id="reviewContent" class="review-grid"></div>
      <div class="button-group">
        <button class="btn btn-secondary" onclick="prevStep()">&larr; Back</button>
        <button class="btn btn-primary" onclick="submitData()">Submit Data ✅</button>
      </div>
    </div>

  </div>
</div>

<script>
  // YOUR N8N URL
  const WEBHOOK_URL = "https://taherkib.app.n8n.cloud/webhook/001b4e4f-5d0b-4a3a-a24c-2fb495b7af4f";

  // STATE
  let currentStep = 1;
  let mode = 'add';
  let selectedType = null;
  let currentId = null;
  let formData = {};

  // SCHEMAS: Exact match to your CSV Columns
  const schemas = {
    product: {
      basic: [
        { key: 'product_id', label: 'Product ID', type: 'text', placeholder: 'Auto (e.g. PRD-0001)', readonlyInEdit: true },
        { key: 'product_name', label: 'Product Name', type: 'text' },
        { key: 'family', label: 'Family', type: 'select', options: ['Cards', 'Accounts', 'Deposits', 'Digital', 'Financing', 'Loans', 'Treasury'] },
        { key: 'tier', label: 'Tier', type: 'select', options: ['Basic', 'Standard', 'Plus', 'Premium', 'Gold', 'Platinum'] },
        { key: 'status', label: 'Status', type: 'select', options: ['draft', 'active', 'archived'] },
        { key: 'owner', label: 'Owner (Dept)', type: 'text' }
      ],
      details: [
        { key: 'description', label: 'Description', type: 'textarea', full: true },
        { key: 'features', label: 'Features', type: 'textarea', full: true },
        { key: 'eligibility', label: 'Eligibility', type: 'textarea', full: true },
        { key: 'fees', label: 'Fees', type: 'text' },
        { key: 'channels', label: 'Channels', type: 'text' },
        { key: 'keywords', label: 'Keywords', type: 'text', full: true },
        { key: 'sample_questions', label: 'Sample Questions', type: 'textarea', full: true }
      ]
    },
    procedure: {
      basic: [
        { key: 'procedure_id', label: 'Procedure ID', type: 'text', placeholder: 'Auto (e.g. PROC-0001)', readonlyInEdit: true },
        { key: 'procedure_name', label: 'Procedure Name', type: 'text', full: true },
        { key: 'related_area', label: 'Related Area', type: 'text' },
        { key: 'sla', label: 'SLA', type: 'text' },
        { key: 'risk_level', label: 'Risk Level', type: 'select', options: ['low', 'medium', 'high'] },
        { key: 'owner', label: 'Owner', type: 'text' }
      ],
      details: [
        { key: 'when_to_use', label: 'When to Use', type: 'textarea', full: true },
        { key: 'step_by_step', label: 'Steps (HTML/Text)', type: 'textarea', full: true },
        { key: 'systems_used', label: 'Systems Used', type: 'text' },
        { key: 'common_errors', label: 'Common Errors', type: 'text', full: true },
        { key: 'keywords', label: 'Keywords', type: 'text', full: true },
        { key: 'sample_questions', label: 'Sample Questions', type: 'textarea', full: true }
      ]
    },
    policy: {
      basic: [
        { key: 'policy_id', label: 'Policy ID', type: 'text', placeholder: 'Auto (e.g. POL-0001)', readonlyInEdit: true },
        { key: 'policy_name', label: 'Policy Name', type: 'text' },
        { key: 'scope', label: 'Scope', type: 'text' },
        { key: 'status', label: 'Status', type: 'select', options: ['draft', 'active', 'under_review'] },
        { key: 'review_cycle', label: 'Review Cycle', type: 'select', options: ['annual', 'semi-annual', 'quarterly'] },
        { key: 'owner', label: 'Owner', type: 'text' }
      ],
      details: [
        { key: 'summary', label: 'Summary', type: 'textarea', full: true },
        { key: 'do', label: 'Do (Allowed)', type: 'textarea', full: true },
        { key: 'dont', label: 'Don\'t (Prohibited)', type: 'textarea', full: true },
        { key: 'applicable_to', label: 'Applicable To', type: 'text' },
        { key: 'escalation', label: 'Escalation Point', type: 'text' },
        { key: 'keywords', label: 'Keywords', type: 'text', full: true },
        { key: 'sample_questions', label: 'Sample Questions', type: 'textarea', full: true }
      ]
    }
  };

  // --- LOGIC ---

  function setMode(m, e) {
    mode = m;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    if(e) e.target.classList.add('active');
    
    const searchBox = document.getElementById('searchBox');
    if (mode === 'edit') {
      searchBox.classList.add('show');
      document.getElementById('btnStep1').disabled = true;
    } else {
      searchBox.classList.remove('show');
      formData = {};
      if(selectedType) document.getElementById('btnStep1').disabled = false;
    }
    renderForms();
  }

  function selectType(t, el) {
    selectedType = t;
    document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    
    formData = {};
    if (mode === 'add') {
      document.getElementById('btnStep1').disabled = false;
    } else {
      document.getElementById('btnStep1').disabled = true;
      document.getElementById('searchStatus').innerText = '';
    }
    renderForms();
  }

  async function fetchData() {
    const id = document.getElementById('searchId').value.trim();
    const status = document.getElementById('searchStatus');
    if(!selectedType) return alert('Select a type first');
    if(!id) return alert('Enter an ID');

    status.innerText = 'Searching...';
    status.style.color = 'var(--muted)';

    try {
      const url = `${WEBHOOK_URL}?action=fetch&type=${selectedType}&id=${encodeURIComponent(id)}`;
      const res = await fetch(url);
      const data = await res.json();
      
      let row = Array.isArray(data) ? data[0] : data;
      
      if (!row || Object.keys(row).length === 0 || row.error) {
        status.innerText = '❌ Not Found';
        status.style.color = '#ef4444';
        return;
      }

      status.innerText = '✅ Found!';
      status.style.color = '#10b981';
      formData = row;
      currentId = id;
      document.getElementById('btnStep1').disabled = false;
      renderForms();
      
    } catch(e) {
      status.innerText = '❌ Network Error';
      status.style.color = '#ef4444';
      console.error(e);
    }
  }

  function renderForms() {
    if(!selectedType) return;
    const schema = schemas[selectedType];
    
    const build = (fields) => fields.map(f => {
      const val = formData[f.key] || '';
      const isReadonly = mode === 'edit' && f.readonlyInEdit ? 'disabled style="background:var(--bg1);"' : '';
      
      let input = '';
      if(f.type === 'textarea') {
        input = `<textarea name="${f.key}" class="form-textarea" ${isReadonly}>${val}</textarea>`;
      } else if(f.type === 'select') {
        input = `<select name="${f.key}" class="form-select" ${isReadonly}>
          <option value="">Select...</option>
          ${f.options.map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
        </select>`;
      } else {
        input = `<input type="text" name="${f.key}" value="${val}" class="form-input" placeholder="${f.placeholder||''}" ${isReadonly}>`;
      }
      
      return `<div class="form-group ${f.full?'full':''}">
        <label class="form-label">${f.label}</label>
        ${input}
      </div>`;
    }).join('');

    document.getElementById('formBasic').innerHTML = build(schema.basic);
    document.getElementById('formDetails').innerHTML = build(schema.details);
  }

  function harvest() {
    const inputs = document.querySelectorAll(`#section${currentStep} input, #section${currentStep} select, #section${currentStep} textarea`);
    inputs.forEach(i => formData[i.name] = i.value);
  }

  function nextStep() {
    harvest();
    if(currentStep < 4) {
      currentStep++;
      updateSteps();
    }
    if(currentStep === 4) renderReview();
  }

  function prevStep() {
    harvest();
    if(currentStep > 1) {
      currentStep--;
      updateSteps();
    }
  }

  function updateSteps() {
    document.querySelectorAll('.step').forEach((s, i) => {
      s.classList.remove('active', 'completed');
      if(i + 1 < currentStep) s.classList.add('completed');
      if(i + 1 === currentStep) s.classList.add('active');
    });
    document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
    document.getElementById(`section${currentStep}`).classList.add('active');
  }

  function renderReview() {
    let html = '';
    const allFields = [...schemas[selectedType].basic, ...schemas[selectedType].details];
    
    allFields.forEach(f => {
      if(formData[f.key]) {
        html += `<div class="review-item ${f.full?'full':''}">
          <div class="review-label">${f.label}</div>
          <div class="review-val">${formData[f.key]}</div>
        </div>`;
      }
    });
    document.getElementById('reviewContent').innerHTML = html;
  }

  async function submitData() {
    const btn = document.querySelector('#section4 .btn-primary');
    const oldText = btn.innerText;
    btn.innerText = 'Submitting...';
    btn.disabled = true;

    // Add Metadata
    formData.last_updated = new Date().toISOString().split('T')[0];
    if(selectedType === 'policy') formData.last_reviewed = formData.last_updated;

    const payload = {
      action: mode === 'add' ? 'add_item' : 'update_item',
      type: selectedType,
      id_column: selectedType + '_id', // e.g., product_id
      id_value: formData[selectedType + '_id'] || currentId,
      data: formData
    };

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      
      if(res.ok) {
        alert('Success! Data saved.');
        location.reload();
      } else {
        alert('Error saving data.');
      }
    } catch(e) {
      alert('Network Error: ' + e.message);
    } finally {
      btn.innerText = oldText;
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
