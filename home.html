<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat3PT | KIB Knowledge Assistant</title>
    <style>
        :root {
            --bg-primary: #f0f4f8;
            --bg-secondary: #e8f1f6;
            --card-bg: #ffffff;
            --text-primary: #1a202c;
            --text-secondary: #718096;
            --text-muted: #a0aec0;
            --brand-primary: #0d7a6f;
            --brand-secondary: #0ea5e9;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #e8f1f6 0%, #f0f4f8 100%);
            min-height: 100%;
            color: var(--text-primary);
            padding: 40px 20px;
            position: relative;
        }

        /* Subtle background decoration */
        body::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.08), transparent 70%);
            top: -200px;
            right: -200px;
            border-radius: 50%;
            animation: float 15s ease-in-out infinite;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(13, 122, 111, 0.06), transparent 70%);
            bottom: -150px;
            left: -150px;
            border-radius: 50%;
            animation: float 20s ease-in-out infinite reverse;
            z-index: 0;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            animation: fadeInUp 0.8s ease-out forwards;
            position: relative;
            z-index: 1;
        }

        /* Logo Section - No frame, centered */
        .logo-section {
            margin-bottom: 50px;
            animation: fadeIn 1s ease-out;
        }

        .logo-image {
            max-width: 450px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08));
            transition: transform 0.3s ease;
        }

        .logo-image:hover {
            transform: scale(1.02);
        }

        /* Desktop logo sizing */
        @media (min-width: 1200px) {
            .logo-image {
                max-width: 550px;
            }
        }

        /* Card Grid - Desktop First Approach */
        .card-grid {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 0;
        }

        /* Role Cards - Desktop sizing */
        .role-card {
            background: var(--card-bg);
            border: 1px solid rgba(226, 232, 240, 0.8);
            padding: 50px 35px;
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: slideInCard 0.8s ease-out forwards;
            opacity: 0;
            flex: 1;
            min-width: 280px;
            max-width: 340px;
        }

        .role-card:nth-child(1) {
            animation-delay: 0.2s;
        }

        .role-card:nth-child(2) {
            animation-delay: 0.4s;
        }

        .role-card:nth-child(3) {
            animation-delay: 0.6s;
        }

        .role-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(13, 122, 111, 0.03), rgba(14, 165, 233, 0.03));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .role-card:hover::before {
            opacity: 1;
        }

        .role-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: var(--shadow-lg);
            border-color: rgba(13, 122, 111, 0.4);
        }

        /* Desktop-specific hover enhancement */
        @media (min-width: 981px) {
            .role-card:hover {
                transform: translateY(-12px) scale(1.03);
            }
        }

        /* Icon Circle */
        .icon-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e8f5f3 0%, #dbeafe 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .role-card:hover .icon-circle {
            transform: scale(1.1);
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            box-shadow: 0 8px 20px rgba(13, 122, 111, 0.25);
        }

        .role-card:hover .icon-circle::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            z-index: -1;
            opacity: 0.3;
            filter: blur(8px);
        }

        /* Card Content */
        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .role-card:hover .card-title {
            color: var(--brand-primary);
        }

        .card-description {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 280px;
            text-align: center;
        }

        /* Desktop enhancement for descriptions */
        @media (min-width: 1200px) {
            .card-description {
                max-width: 300px;
                line-height: 1.7;
            }
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInCard {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float {
            0%, 100% { 
                transform: translate(0, 0) scale(1);
            }
            50% { 
                transform: translate(20px, -20px) scale(1.05);
            }
        }

        /* Responsive Design */
        @media (max-width: 980px) {
            .card-grid {
                flex-direction: column;
                gap: 24px;
                padding: 10px 0;
            }

            .role-card {
                max-width: 100%;
                width: 100%;
                padding: 35px 25px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 30px 15px;
            }

            body::before,
            body::after {
                display: none;
            }

            .container {
                padding: 0;
            }

            .logo-image {
                max-width: 320px;
            }

            .logo-section {
                margin-bottom: 35px;
            }

            .card-grid {
                gap: 20px;
            }

            .role-card {
                padding: 30px 20px;
                min-width: auto;
            }

            .icon-circle {
                width: 75px;
                height: 75px;
                font-size: 34px;
            }

            .card-title {
                font-size: 1.3rem;
            }

            .card-description {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 10px;
            }

            .logo-image {
                max-width: 260px;
            }

            .logo-section {
                margin-bottom: 30px;
            }

            .card-grid {
                gap: 15px;
            }

            .role-card {
                padding: 25px 20px;
            }

            .icon-circle {
                width: 70px;
                height: 70px;
                font-size: 32px;
            }

            .card-title {
                font-size: 1.2rem;
            }

            .card-description {
                font-size: 0.9rem;
                max-width: 240px;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 15px 8px;
            }

            .logo-image {
                max-width: 220px;
            }

            .role-card {
                padding: 20px 15px;
            }

            .card-description {
                font-size: 0.85rem;
                max-width: 200px;
            }
        }

        /* Ensure desktop centering and spacing */
        @media (min-width: 981px) {
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 60px 40px;
            }

            .card-grid {
                gap: 40px;
            }

            .role-card {
                min-height: 320px;
            }

            .logo-section {
                margin-bottom: 60px;
            }
        }

        @media (min-width: 1200px) {
            .card-grid {
                gap: 50px;
            }

            .role-card {
                padding: 55px 40px;
            }

            .icon-circle {
                width: 100px;
                height: 100px;
                font-size: 45px;
            }

            .card-title {
                font-size: 1.6rem;
            }

            .card-description {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Section -->
        <div class="logo-section">
            <img src="https://raw.githubusercontent.com/tg7htk4h89-afk/bank-chatbot-web/refs/heads/main/372d69b7-d1da-4872-b619-bcc28b94f3c7.JPG" 
                 alt="Chat3PT - KIB Knowledge Assistant" 
                 class="logo-image"
                 onerror="this.style.display='none'">
        </div>

        <!-- Role Selection Cards -->
        <div class="card-grid">
            
            <!-- Standard User Card -->
            <a href="https://tg7htk4h89-afk.github.io/bank-chatbot-web/chat.html" class="role-card">
                <div class="icon-circle">
                    👤
                </div>
                <div class="card-title">Standard User</div>
                <div class="card-description">Ask Chat3PT to inquire about policy, procedure, and product</div>
            </a>

            <!-- Editor Admin Card -->
            <a href="https://tg7htk4h89-afk.github.io/bank-chatbot-web/edit.html" class="role-card">
                <div class="icon-circle">
                    ⚙️
                </div>
                <div class="card-title">Editor Admin</div>
                <div class="card-description">Manage knowledge base by adding/amending items</div>
            </a>

            <!-- Dashboard Card -->
            <a href="https://tg7htk4h89-afk.github.io/bank-chatbot-web/dash.html?v=7" class="role-card">
                <div class="icon-circle">
                    📊
                </div>
                <div class="card-title">Dashboard</div>
                <div class="card-description">View KPIs and analytics for Chat3PT performance</div>
            </a>

        </div>
    </div>

</body>
</html>
