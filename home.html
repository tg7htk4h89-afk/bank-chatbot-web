
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIB Chat3P | Select Role</title>
    <style>
        :root {
            --brand: #1f7a6b;
            --brand-light: rgba(31, 122, 107, 0.1);
            --brand2: #0ea5e9;
            --text: #0f172a;
            --muted: #64748b;
            --bg-gradient: radial-gradient(900px 500px at 20% 10%, rgba(14,165,233,.15), transparent 60%),
                           radial-gradient(900px 500px at 80% 85%, rgba(31,122,107,.18), transparent 55%),
                           linear-gradient(180deg, #e8f1f6, #eef2ff);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        /* --- Logo Styling --- */
        .logo-wrapper {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            margin: 0 auto 25px;
            display: grid;
            place-items: center;
            box-shadow: 0 20px 40px rgba(31, 122, 107, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            animation: float 6s ease-in-out infinite;
        }

        .logo-wrapper img {
            width: 70%;
            object-fit: contain;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--brand), #0f5c4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 1.1rem;
            margin-bottom: 50px;
        }

        /* --- Selection Cards --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            max-width: 600px;
            margin: 0 auto;
        }

        .role-card {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.9);
            padding: 30px 20px;
            border-radius: 24px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* Hover Effects */
        .role-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 25px 50px rgba(31, 122, 107, 0.15);
            border-color: var(--brand);
        }

        .icon-box {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--brand-light);
            display: grid;
            place-items: center;
            font-size: 24px;
            transition: background 0.3s;
            color: var(--brand);
        }

        .role-card:hover .icon-box {
            background: var(--brand);
            color: white;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--muted);
            line-height: 1.5;
        }

        /* --- Animations --- */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Mobile Responsiveness */
        @media (max-width: 640px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
            .title { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-wrapper">
            <img src="kib-logo.png" alt="KIB" onerror="this.parentElement.innerHTML='<span style=\'font-weight:800; color:#1f7a6b; font-size:24px;\'>KIB</span>'">
        </div>

        <h1 class="title">Chat3P</h1>
        <p class="subtitle">KIB Knowledge Assistant</p>

        <div class="card-grid">
            
            <a href="chat_standard.html" class="role-card">
                <div class="icon-box">
                    👤
                </div>
                <div class="card-title">User</div>
                <div class="card-desc">Standard access to Chat3PT for queries on products, policies, and procedures.</div>
            </a>

            <a href="chat_editor.html" class="role-card">
                <div class="icon-box">
                    ⚙️
                </div>
                <div class="card-title">Admin</div>
                <div class="card-desc">Edit knowledge base, manage flows, and review logs.</div>
            </a>

        </div>
    </div>

</body>
</html>
