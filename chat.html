<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat3PT</title>

  <style>
    :root{
      --bg1:#e8f1f6;
      --bg2:#eef2ff;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --shadow: 0 14px 40px rgba(2, 6, 23, .10);
      --brand:#1f7a6b;
      --brand2:#0ea5e9;
      --bot:#f1f5f9;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      min-height:100vh;
      background: radial-gradient(900px 500px at 20% 10%, rgba(14,165,233,.12), transparent 60%),
                  radial-gradient(900px 500px at 80% 15%, rgba(31,122,107,.14), transparent 55%),
                  linear-gradient(180deg, var(--bg1), var(--bg2));
      padding: 22px 14px 40px;
    }

    .wrap{ max-width: 980px; margin: 0 auto; }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding: 14px 18px;
      border-radius: 18px;
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(226,232,240,.9);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 26px rgba(2,6,23,.06);
    }
    .brand{ display:flex; align-items:center; gap:12px; min-width: 0; }
    .logo{
      width:42px; height:42px;
      border-radius: 12px;
      background:#fff;
      border:1px solid var(--border);
      display:grid; place-items:center;
      overflow:hidden;
      flex:0 0 auto;
    }
    .logo img{ width:100%; height:100%; object-fit:contain; padding:6px; }
    .brand h1{ font-size: 18px; margin:0; line-height:1.1; letter-spacing:.2px; }
    .brand p{
      margin:4px 0 0;
      font-size: 12.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 520px;
    }

    .topbar-right{
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .feedback-btn{
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.9);
      color: var(--brand);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .feedback-btn:hover{
      background: var(--brand);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(31,122,107,.2);
    }

    .status{
      display:flex; align-items:center; gap:10px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.8);
      flex:0 0 auto;
      font-size: 12.5px;
      color: var(--muted);
    }
    .dot{
      width:10px; height:10px; border-radius:50%;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34,197,94,.14);
    }

    .card{
      margin-top: 14px;
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(226,232,240,.95);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .chat{
      height: 540px;
      overflow:auto;
      padding: 18px 18px 10px;
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.78));
    }

    .msg{ display:flex; margin: 12px 0; gap:10px; align-items:flex-end; }
    .msg.me{ justify-content:flex-end; }
    .msg.bot{ justify-content:flex-start; }

    .avatar{
      width:34px; height:34px;
      border-radius: 12px;
      border:1px solid var(--border);
      background:#fff;
      display:grid; place-items:center;
      color: var(--muted);
      font-size: 12px;
      flex:0 0 auto;
      user-select:none;
    }
    .msg.me .avatar{
      background: rgba(31,122,107,.10);
      color: var(--brand);
      border-color: rgba(31,122,107,.25);
    }

    .bubbleWrap{ max-width: 75%; display:flex; flex-direction:column; gap:6px; }
    .bubble{
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.6;
      word-break: break-word;
      box-shadow: 0 10px 26px rgba(2,6,23,.06);
      border: 1px solid rgba(226,232,240,.8);
      font-size: 14px;
      white-space: pre-wrap;
    }
    .msg.bot .bubble{
      background: var(--bot);
      color: var(--text);
      border-bottom-left-radius: 8px;
    }
    .msg.me .bubble{
      background: var(--brand);
      color: #fff;
      border-color: rgba(31,122,107,.35);
      border-bottom-right-radius: 8px;
    }

    .meta{
      font-size: 11.5px;
      color: var(--muted);
      display:flex;
      gap:10px;
      align-items:center;
    }
    .msg.me .meta{ justify-content:flex-end; }
    .msg.bot .meta{ justify-content:flex-start; }

    .divider{ height:1px; background: rgba(226,232,240,.9); }

    .composer{
      display:flex;
      flex-direction: column;
      gap:12px;
      padding: 14px;
      background: rgba(255,255,255,.92);
    }
    .category-row{ display:flex; gap:10px; align-items:center; }
    .category-label{ font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; }

    .composer-row{ display:flex; gap:10px; align-items:stretch; }
    .select{
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 12px;
      font-size: 14px;
      outline: none;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      flex: 1;
    }
    .select:focus{
      border-color: rgba(14,165,233,.55);
      box-shadow: 0 0 0 4px rgba(14,165,233,.12);
    }

    .input{
      flex:1;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 12px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }
    .input:focus{
      border-color: rgba(14,165,233,.55);
      box-shadow: 0 0 0 4px rgba(14,165,233,.12);
    }

    .btn{
      border:none;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 600;
      cursor:pointer;
      background: linear-gradient(180deg, rgba(31,122,107,1), rgba(22,120,105,.95));
      color:#fff;
      min-width: 92px;
      box-shadow: 0 10px 18px rgba(31,122,107,.18);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; box-shadow:none; }

    .foot{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:10px;
      padding: 10px 14px 14px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(255,255,255,.92);
    }
    .foot .small{ opacity:.9; }

    /* ===== TYPING INDICATOR STYLES ===== */
    .typing-indicator{
      display:none;
      align-items:flex-end;
      gap:10px;
      padding: 12px 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.78));
    }
    .typing-indicator.show{ display:flex; }
    .typing-indicator .avatar{
      width: 34px; height: 34px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
      flex: 0 0 auto;
    }
    .typing-bubble{
      background: var(--bot);
      border: 1px solid rgba(226,232,240,.8);
      border-radius: 16px;
      border-bottom-left-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 10px 26px rgba(2,6,23,.06);
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .typing-dot{
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      animation: typingBounce 1.4s infinite;
    }
    .typing-dot:nth-child(2){ animation-delay: 0.2s; }
    .typing-dot:nth-child(3){ animation-delay: 0.4s; }
    @keyframes typingBounce{
      0%, 60%, 100% { transform: translateY(0); opacity: 0.7; }
      30% { transform: translateY(-10px); opacity: 1; }
    }

    /* ===== FEEDBACK MODAL STYLES ===== */
    .modal-overlay{
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.3s;
    }
    .modal-overlay.show{ display: flex; }

    .modal-content{
      background: white;
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease-out;
    }

    .modal-header{
      background: linear-gradient(135deg, rgba(31,122,107,0.08), rgba(14,165,233,0.08));
      padding: 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 22px 22px 0 0;
    }

    .modal-header h2{
      margin: 0;
      font-size: 20px;
      color: var(--brand);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-close{
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: rgba(0, 0, 0, 0.05);
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.2s;
    }
    .modal-close:hover{
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
    }

    .modal-body{ padding: 24px; }

    .form-row{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }
    .form-group{ display: flex; flex-direction: column; gap: 8px; }
    .form-group.full{ grid-column: 1 / -1; }

    .form-label{ font-size: 14px; font-weight: 600; color: var(--text); }
    .form-input, .form-select, .form-textarea{
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      background: #fff;
      color: var(--text);
      transition: all 0.2s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus{
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(31,122,107,0.1);
    }
    .form-select{
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%2364748b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
      padding-right: 40px;
    }
    .form-textarea{ resize: vertical; min-height: 120px; line-height: 1.6; }

    .submit-btn{
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, var(--brand), #16756a);
      color: #fff;
      box-shadow: 0 10px 20px rgba(31,122,107,.25);
      transition: all 0.3s;
    }
    .submit-btn:hover{
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(31,122,107,.35);
    }
    .submit-btn:disabled{ opacity: 0.6; cursor: not-allowed; transform: none; }

    .success-message{
      display: none;
      padding: 24px;
      text-align: center;
      color: var(--brand);
      font-size: 16px;
      font-weight: 600;
      animation: fadeIn 0.5s;
    }
    .success-message.show{ display: block; }

    @keyframes fadeIn{
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp{
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 720px){
      .chat{ height: 68vh; }
      .brand p{ max-width: 240px; }
      .bubbleWrap{ max-width: 86%; }
      .form-row { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: stretch; gap: 10px; }
      .topbar-right { justify-content: space-between; }
      .modal-content { max-height: 85vh; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo" title="KIB">
          <img src="https://tg7htk4h89-afk.github.io/bank-chatbot-web/logo3gpt.jpg" alt="Chat3PT logo" onerror="this.style.display='none'; this.parentElement.textContent='KIB'; this.parentElement.style.fontWeight='700';" />
        </div>
        <div style="min-width:0">
          <h1>Chat3PT</h1>
          <p>KIB Knowledge Assistant (Products • Policies • Procedures)</p>
        </div>
      </div>

      <div class="topbar-right">
        <button class="feedback-btn" onclick="openFeedbackModal()">
          <span style="font-size: 16px;">💬</span>
          Feedback
        </button>
        <div class="status">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Ready</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="chat" id="chat"></div>

      <div class="typing-indicator" id="typingIndicator">
        <div class="avatar">3PT</div>
        <div class="typing-bubble">
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="composer">
        <div class="category-row">
          <span class="category-label">Please choose category or use Auto-detect</span>
        </div>

        <input id="inp" class="input" placeholder="Type your question..." autocomplete="off" style="width: 100%;" />

        <div class="composer-row">
          <select id="categorySelect" class="select">
            <option value="">Auto-detect</option>
            <option value="policy">Policy</option>
            <option value="procedure">Procedure</option>
            <option value="product">Product</option>
          </select>
          <button id="sendBtn" class="btn">Send</button>
        </div>
      </div>

      <div class="foot">
        <div class="small">Chat3PT • Web UI</div>
      </div>
    </div>
  </div>

  <!-- Feedback Modal -->
  <div class="modal-overlay" id="feedbackModal" onclick="closeFeedbackModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2>
          <span style="font-size: 24px;">💬</span>
          Feedback
        </h2>
        <button class="modal-close" onclick="closeFeedbackModal()">&times;</button>
      </div>

      <div class="modal-body" id="feedbackFormContainer">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Your Name</label>
            <input type="text" class="form-input" id="feedbackName" placeholder="Your Name" />
          </div>
          <div class="form-group">
            <label class="form-label">Department</label>
            <input type="text" class="form-input" id="feedbackDept" placeholder="Department" />
          </div>
        </div>

        <div class="form-group full">
          <label class="form-label">Feedback Category</label>
          <select class="form-select" id="feedbackCategory">
            <option value="">Select Category</option>
            <option value="policy">Policy</option>
            <option value="procedure">Procedure</option>
            <option value="product">Product</option>
            <option value="general">General Improvement</option>
          </select>
        </div>

        <div class="form-group full">
          <label class="form-label">Your Feedback</label>
          <textarea class="form-textarea" id="feedbackText" placeholder="Share your feedback with us..."></textarea>
        </div>

        <button class="submit-btn" onclick="submitFeedback()">Submit Feedback</button>
      </div>

      <div class="success-message" id="successMessage">
        ✅ Thank you! Your feedback has been sent.
      </div>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://taherkib.app.n8n.cloud/webhook/bf161d07-e9be-48fe-bdfa-0ea9e3e1abb5";

    function getSessionId() {
      const key = "kc_session_id";
      let sid = localStorage.getItem(key);
      if (!sid) {
        sid = "SID-" + Date.now() + "-" + Math.random().toString(16).slice(2);
        localStorage.setItem(key, sid);
      }
      return sid;
    }

    const chat = document.getElementById("chat");
    const inp  = document.getElementById("inp");
    const btn  = document.getElementById("sendBtn");
    const categorySelect = document.getElementById("categorySelect");
    const statusText = document.getElementById("statusText");
    const statusDot  = document.getElementById("statusDot");
    const typingIndicator = document.getElementById("typingIndicator");

    function setStatus(text, ok=true){
      statusText.textContent = text;
      statusDot.style.background = ok ? "#22c55e" : "#ef4444";
      statusDot.style.boxShadow = ok ? "0 0 0 4px rgba(34,197,94,.14)" : "0 0 0 4px rgba(239,68,68,.14)";
    }

    function showTyping() {
      typingIndicator.classList.add('show');
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      typingIndicator.classList.remove('show');
    }

    function timeNow(){
      return new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    }

    function isArabic(text){
      return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(text);
    }

    function add(role, text){
      const row = document.createElement("div");
      row.className = "msg " + (role === "me" ? "me" : "bot");

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = (role === "me") ? "Me" : "3PT";

      const wrap = document.createElement("div");
      wrap.className = "bubbleWrap";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = text;

      bubble.dir = isArabic(text) ? "rtl" : "ltr";
      bubble.style.textAlign = isArabic(text) ? "right" : "left";

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = timeNow();

      wrap.appendChild(bubble);
      wrap.appendChild(meta);

      if (role === "me"){
        row.appendChild(wrap);
        row.appendChild(avatar);
      } else {
        row.appendChild(avatar);
        row.appendChild(wrap);
      }

      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send(){
      const msg = (inp.value || "").trim();
      if (!msg) return;

      const category = categorySelect.value;

      add("me", msg);
      inp.value = "";
      btn.disabled = true;
      setStatus("Sending...", true);
      showTyping();

      try{
        const sid = getSessionId();
        console.log("SESSION_ID:", sid);

        const payload = {
          message: msg,
          session_id: sid,
          category: category
        };

        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const contentType = res.headers.get("content-type") || "";
        let data;

        if (contentType.includes("application/json")){
          data = await res.json();
        } else {
          const t = await res.text();
          throw new Error("Non-JSON response: " + t.slice(0,120));
        }

        let answer = "";

        if (data && Array.isArray(data.output) && data.output.length > 0) {
          const firstOutput = data.output[0];
          if (firstOutput.content && Array.isArray(firstOutput.content) && firstOutput.content[0]) {
            answer = firstOutput.content[0].text || "";
          }
        } else if (data && Array.isArray(data) && data[0] && data[0].output) {
          const firstItem = data[0];
          if (Array.isArray(firstItem.output) && firstItem.output[0]) {
            const firstOutput = firstItem.output[0];
            if (firstOutput.content && Array.isArray(firstOutput.content) && firstOutput.content[0]) {
              answer = firstOutput.content[0].text || "";
            }
          }
        } else if (data && (data.answer || data.output || data.text)) {
          answer = data.answer || data.output || data.text;
        } else {
          answer = JSON.stringify(data, null, 2);
        }

        answer = answer.trim();
        hideTyping();
        add("bot", answer);
        setStatus("Ready", true);

      } catch(e){
        hideTyping();
        add("bot", "Connection error: " + (e?.message || e));
        setStatus("Disconnected", false);
      } finally {
        btn.disabled = false;
        inp.focus();
      }
    }

    add("bot", "Hi — I'm Chat3PT. Ask me about KIB products, policies, or procedures.");
    btn.addEventListener("click", send);
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

    // Feedback Modal Functions
    function openFeedbackModal() {
      document.getElementById('feedbackModal').classList.add('show');
      document.getElementById('successMessage').classList.remove('show');
      document.getElementById('feedbackFormContainer').style.display = 'block';
    }

    function closeFeedbackModal(event) {
      if (!event || event.target.id === 'feedbackModal' || event.target.classList.contains('modal-close')) {
        document.getElementById('feedbackModal').classList.remove('show');
      }
    }

    // Close modal on ESC key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeFeedbackModal();
      }
    });

    async function submitFeedback() {
      const name = document.getElementById('feedbackName').value.trim();
      const dept = document.getElementById('feedbackDept').value.trim();
      const category = document.getElementById('feedbackCategory').value;
      const text = document.getElementById('feedbackText').value.trim();

      if (!name || !dept || !category || !text) {
        alert('Please fill in all fields');
        return;
      }

      const submitBtn = event.target;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'suggestion',
            name: name,
            department: dept,
            category: category,
            suggestion: text,
            timestamp: new Date().toISOString()
          })
        });

        document.getElementById('feedbackFormContainer').style.display = 'none';
        document.getElementById('successMessage').classList.add('show');

        document.getElementById('feedbackName').value = '';
        document.getElementById('feedbackDept').value = '';
        document.getElementById('feedbackCategory').value = '';
        document.getElementById('feedbackText').value = '';

        setTimeout(() => {
          closeFeedbackModal();
        }, 2500);

      } catch (error) {
        alert('Error submitting feedback. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Feedback';
      }
    }
  </script>
</body>
</html>
